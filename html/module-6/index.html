<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/main.css" />

  <body>
    <section class="catalog-section">
      <div class="container">
        <h2 class="catalog-title">Catalog</h2>

        <ul class="catalog-list">
          <li class="catalog-item">
            <img
              src="./images/watch-1.png"
              alt="Garmin Fenix 7X Pro Sapphire"
              width="304"
              height="312"
            />
            <h3 class="catalog-card-title">Garmin Fenix 7X Pro Sapphire</h3>
            <p class="catalog-price">€500</p>
          </li>

          <li class="catalog-item">
            <img
              src="./images/watch-2.png"
              alt="Garmin Marq Athlete "
              width="304"
              height="312"
            />
            <h3 class="catalog-card-title">Garmin Marq Athlete</h3>
            <p class="catalog-price">€450</p>
          </li>

          <li class="catalog-item">
            <img
              src="./images/watch-3.png"

              width="304"
              height="312"
            />
            <h3 class="catalog-card-title">Garmin Descent MK1</h3>
            <p class="catalog-price">€680</p>
          </li>

          <li class="catalog-item">
            <img
              src="./images/watch-4.png"

              width="304"
              height="312"
            />
            <h3 class="catalog-card-title">Garmin D2 Delta PX</h3>
            <p class="catalog-price">€380</p>
          </li>

          <li class="catalog-item">
            <img
              src="./images/watch-5.png"
              alt="Garmin Fenix 6 Pro Solar"
              width="304"
              height="312"
            />
            <h3 class="catalog-card-title">Garmin Fenix 6 Pro Solar</h3>
            <p class="catalog-price">€400</p>
          </li>

          <li class="catalog-item">
            <img
              src="./images/watch-6.png"
              alt="Tube Watch S42 Date Steel"
              width="304"
              height="312"
            />
            <h3 class="catalog-card-title">Tube Watch S42 Date Steel</h3>
            <p class="catalog-price">€395</p>
          </li>
        </ul>
      </div>
    </section>

</html>
